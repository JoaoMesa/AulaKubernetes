apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-distribuida
spec:
  # PREENCHA AQUI: Quantas réplicas queremos?
  # SUGESTÃO: Você quer que a aplicação sobreviva à queda de UMA máquina inteira.
  # Se você tem 2 máquinas disponíveis, quantas cópias você precisa para que,
  # se uma cair, a outra continue no ar? (Escolha um número maior que 1 e menor que 4).
  replicas:
  selector:
    matchLabels:
      app: distribuida
  template:
    metadata:
      labels:
        # ATENÇÃO: A sua etiqueta (label) é "app: distribuida".
        # Guarde bem essas duas palavras, você vai usá-las no Anti-affinity!
        app: distribuida
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  # -----------------------------------------------------------
                  # PREENCHA AQUI: Qual é a CHAVE da etiqueta?
                  # -----------------------------------------------------------
                  # DICA: Olhe para as linhas 14 e 17. A chave é a palavra
                  # que vem antes dos dois pontos. Se você mudasse a etiqueta no topo
                  # para "time: azul", a chave aqui teria que ser "time".
                  - key: [PREENCHA A CHAVE AQUI]

                    operator: In

                    # -----------------------------------------------------------
                    # PREENCHA AQUI: Qual é o VALOR da etiqueta?
                    # -----------------------------------------------------------
                    # DICA: É a palavra que vem depois dos dois pontos lá no topo.
                    values: ["[PREENCHA O VALOR AQUI]"]

              # ---------------------------------------------------------------
              # PREENCHA AQUI: Qual é a chave que representa uma "máquina física"?
              # ---------------------------------------------------------------
              # SUGESTÃO: O Kubernetes não sabe o que é uma "máquina" ou um "servidor".
              # Ele usa o conceito de "Topologia". Para dizer "não quero na mesma máquina",
              # usamos a chave padrão que representa o hostname do nó.
              # PESQUISE NO GOOGLE: "kubernetes topologyKey hostname"
              # O valor vai ser algo terminado em "hostname".
              topologyKey: [PREENCHA A CHAVE DE TOPOLOGIA AQUI]

      containers:
        - name: web
          # PREENCHA AQUI: Use a imagem que mostra o nome do Pod.
          # SUGESTÃO: Vá no site hub.docker.com e pesquise por "nginxdemos/hello".
          # Escolha a versão que tem a tag "plain-text".
          # Ela é a única que devolve texto simples para o nosso comando "curl".
          image:
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-distribuida
spec:
  type: NodePort
  selector:
    app: distribuida
  ports:
    - port: 80
      targetPort: 80
      # PREENCHA AQUI: Qual porta externa vamos usar?
      # SUGESTÃO: As portas NodePort permitidas pelo Kubernetes vão de 30000 a 32767.
      # Escolha uma porta "redonda" e fácil de lembrar para todos acessarem igual
      # (ex: 30000, 30080, 31000).
      nodePort:
